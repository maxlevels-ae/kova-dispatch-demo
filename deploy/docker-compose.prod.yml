# Production stack: app + MongoDB + Redis + Caddy (automatic HTTPS).
# Run from the repo root:  docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build
services:
  app:
    build:
      context: ..
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_CARTO_BASEMAP_KEY: ${NEXT_PUBLIC_CARTO_BASEMAP_KEY:-}
    env_file: ../.env.production
    environment:
      MONGODB_URI: mongodb://mongodb:27017/kova
      REDIS_URL: redis://redis:6379
    depends_on: [mongodb, redis]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
  mongodb:
    image: mongo:7
    volumes: [mongodb_data:/data/db]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped
volumes:
  mongodb_data:
  redis_data:
  caddy_data:
  caddy_config:
